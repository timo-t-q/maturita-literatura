name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Potrebné oprávnenia na publikovanie na GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Nechaj bežať len jeden deploy naraz; rozbehnutý deploy nezrušíme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kontrola aktuálnosti generovaného indexu
        run: |
          npm run generate:index
          if ! git diff --quiet src/data/prehlad.generated.ts src/data/autori.generated.ts; then
            echo "::error::Generovaný index nie je aktuálny — spusti npm run generate:index"
            exit 1
          fi

      - name: Kontrola typov
        run: npx tsc -b

      - name: Kontrola integrity dát
        run: npm run validate

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
